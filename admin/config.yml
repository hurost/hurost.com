backend:
  name: github
  repo: hurost/hurost.com
  branch: main
  base_url: https://hurost-cms-auth.hurost-crg-1de.workers.dev
auth_endpoint: /auth

media_folder: "assets/images"
public_folder: "assets/images"

collections:
  - name: "wideMind"
    label: "واید مایند"
    files:
      - file: "assets/data/content.json"
        label: "محتوای سایت"
        name: "site_data"
        fields:
          - label: "پروژه‌ها"
            name: "wideMind"
            widget: "list"
            fields:
              - { label: "شناسه", name: "id", widget: "string" }
              - { label: "عنوان", name: "title", widget: "string" }
              - { label: "دسته‌بندی", name: "category", widget: "string" }
              - { label: "خلاصه", name: "summary", widget: "text" }
              - { label: "تصویر", name: "image", widget: "string" }
              - { label: "وضعیت", name: "status", widget: "string" }
              - { label: "لینک", name: "link", widget: "string" }