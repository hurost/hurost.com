<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wide Mind | هورست</title>

    <style>
        /* استایل‌های اختصاصی با پالت رنگی هورست */
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #181818;
            --accent-gold: #eec68e;
            --green-dark: #455548;
            --green-light: #a5d2ae;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #282828;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            direction: rtl;
        }

        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-menu {
            display: flex;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .main-menu a {
            color: var(--accent-gold);
            text-decoration: none;
            font-size: 15px;
            transition: opacity 0.2s;
        }

        .main-menu a:hover {
            opacity: 0.8;
        }

        .wide-mind-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .hero-section h1 {
            font-size: 32px;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }

        .hero-section p {
            color: var(--text-muted);
            font-size: 16px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .project-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }

        .card-image {
            width: 100%;
            height: 200px;
            background-color: #222;
            position: relative;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 24px;
        }

        .status-badge {
            display: inline-block;
            background: var(--green-dark);
            color: var(--green-light);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .card-body h3 {
            margin: 0 0 10px 0;
            font-size: 20px;
            color: var(--text-main);
        }

        .card-body p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- هدر و منوی اصلی -->
    <header>
        <div style="font-weight: bold; color: var(--accent-gold); font-size: 20px;">Hurost</div>
        <nav>
            <ul class="main-menu"></ul>
        </nav>
    </header>

    <main class="wide-mind-container">
        <section class="hero-section">
            <h1>واید مایند (Wide Mind)</h1>
            <p>مسئولیت اجتماعی و پروژه‌های عام‌المنفعه استودیو هورست</p>
        </section>

        <!-- محل قرارگیری کارت‌ها -->
        <section id="wide-mind-grid" class="grid-container"></section>
    </main>

    <script>
        // داده‌های پیش‌فرض پشتیبان (اگر فایل JSON روی سیستم لوکال مسدود شد)
        const fallbackData = {
            navigation: [
                { title: "خانه", link: "index.html" },
                { title: "واید مایند", link: "wide-mind.html" },
                { title: "سرگرمی", link: "#" }
            ],
            wideMind: [
                {
                    id: "risheh",
                    title: "پروژه ریشه",
                    category: "مسئولیت اجتماعی",
                    summary: "پروژه‌ای هدفمند در راستای مسئولیت‌های اجتماعی و زیست‌بومی استودیو هورست برای توسعه و آموزش پایدار.",
                    image: "assets/images/risheh-cover.jpg",
                    link: "#",
                    status: "در حال اجرا"
                }
            ]
        };

        document.addEventListener('DOMContentLoaded', () => {
            // ابتدا سعی می‌کند از فایل JSON بخواند
            fetch('assets/data/content.json')
                .then(res => {
                    if (!res.ok) throw new Error("محدودیت اجرا روی فایل لوکال");
                    return res.json();
                })
                .then(data => renderAll(data))
                .catch(err => {
                    console.warn("استفاده از داده‌های پشتیبان به دلیل:", err.message);
                    // اگر مسدود بود، مستقیم از داده‌های پیش‌فرض استفاده می‌کند
                    renderAll(fallbackData);
                });
        });

        function renderAll(data) {
            if (data.navigation) {
                document.querySelector('.main-menu').innerHTML = data.navigation
                    .map(item => `<li><a href="${item.link}">${item.title}</a></li>`)
                    .join('');
            }

            if (data.wideMind) {
                document.getElementById('wide-mind-grid').innerHTML = data.wideMind
                    .map(project => `
            <article class="project-card">
              <div class="card-image">
                <img src="${project.image}" alt="${project.title}" onerror="this.style.display='none'">
              </div>
              <div class="card-body">
                <span class="status-badge">${project.status}</span>
                <h3>${project.title}</h3>
                <p>${project.summary}</p>
                <a href="${project.link}" class="btn-link">مشاهده پروژه ←</a>
              </div>
            </article>
          `).join('');
            }
        }
    </script>
</body>

</html>
